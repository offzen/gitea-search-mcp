name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit + E2E + Floors (Ubuntu, py${{ matrix.python }}, node${{ matrix.node }})
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            node: '20'
          - python: '3.12'
            node: '22'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd sqlite3

      - name: Install Python & Node Dependencies
        run: |
          pip install jieba PyYAML
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Full Test Suite with Fail-Closed Count Floors
        run: |
          python3 -V
          node -v
          python3 scripts/collect-test-counts.py
          bash scripts/respawn-mcp.sh --selftest

  package:
    name: Packaging (wheel + sdist + npm pack) & Hygiene
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build & Validate Python wheel and sdist outside checkout
        run: |
          python -m pip install --upgrade build
          python -m build
          python scripts/test-python-package.py dist

      - name: Build & Validate npm tarball outside checkout
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/test-npm-package.mjs

      - name: Check public-tree hygiene
        run: python scripts/check-public-hygiene.py

  test-macos:
    name: Unit + E2E + Floors (macOS, py3.12, node22)
    if: github.server_url == 'https://github.com'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install System Dependencies
        run: |
          command -v sqlite3 || brew install sqlite
          command -v zstd || brew install zstd

      - name: Install Python & Node Dependencies
        run: |
          pip install jieba PyYAML
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Full Test Suite with Fail-Closed Count Floors
        run: |
          python3 -V
          node -v
          python3 scripts/collect-test-counts.py
