name: Release & Provenance

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, Verify & Attest Release Artifacts
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify version metadata & public hygiene
        shell: bash
        run: |
          set -euo pipefail
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(node -p "require('./package.json').version")"
          PY_VER="$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [[ "$TAG_VER" != "$PKG_VER" || "$TAG_VER" != "$PY_VER" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} mismatches package.json (${PKG_VER}) or pyproject.toml (${PY_VER})"
            exit 1
          fi
          python3 scripts/check-public-hygiene.py

      - name: Build & verify Python (wheel + sdist) and npm (.tgz) artifacts
        run: |
          python -m pip install --upgrade build
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p release-dist
          python -m build --outdir release-dist
          npm pack --ignore-scripts --pack-destination release-dist
          python scripts/test-python-package.py release-dist
          node scripts/test-npm-package.mjs
          (cd release-dist && sha256sum * > SHA256SUMS)

      - name: Attest build provenance (Sigstore / GitHub Attestations)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-dist/*'

      - name: Attach verified artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-dist/* --clobber
