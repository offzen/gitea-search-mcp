name: Release & Provenance

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify Tag Metadata & Public Hygiene
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify version metadata & public hygiene
        shell: bash
        run: |
          set -euo pipefail
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(node -p "require('./package.json').version")"
          LOCK_VER="$(node -p "require('./package-lock.json').version")"
          PY_VER="$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [[ "$TAG_VER" != "$PKG_VER" || "$TAG_VER" != "$LOCK_VER" || "$TAG_VER" != "$PY_VER" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} mismatches package.json (${PKG_VER}), package-lock.json (${LOCK_VER}), or pyproject.toml (${PY_VER})"
            exit 1
          fi
          python3 scripts/check-public-hygiene.py

  ci:
    name: Linux + macOS + Packaging Gate
    if: github.server_url == 'https://github.com'
    needs: [preflight]
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  windows-ci:
    name: Windows Native Gate
    if: github.server_url == 'https://github.com'
    needs: [preflight]
    uses: ./.github/workflows/windows-ci.yml
    permissions:
      contents: read

  release:
    name: Build, Verify & Attest Release Artifacts
    if: github.server_url == 'https://github.com'
    needs: [preflight, ci, windows-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build & verify Python (wheel + sdist) and npm (.tgz) artifacts
        run: |
          python -m pip install --upgrade build
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p release-dist
          python -m build --outdir release-dist
          npm pack --ignore-scripts --pack-destination release-dist
          python scripts/test-python-package.py release-dist
          node scripts/test-npm-package.mjs release-dist/gitea-search-mcp-*.tgz
          (cd release-dist && rm -f SHA256SUMS && sha256sum *.whl *.tar.gz *.tgz > SHA256SUMS)

      - name: Attest build provenance (Sigstore / GitHub Attestations)
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-dist/*'

      - name: Attach verified artifacts to GitHub Release
        if: ${{ github.event.repository.private == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          python3 - "$GITHUB_REF_NAME" "$NOTES_FILE" <<'PY'
          import pathlib, re, sys
          ver = sys.argv[1].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"(?ms)^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text)
          body = m.group(1).strip() if m else ""
          pathlib.Path(sys.argv[2]).write_text((body + "\n") if body else f"Release {sys.argv[1]}\n", encoding="utf-8")
          PY
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
          fi
          rm -f "$NOTES_FILE"
          gh release upload "$GITHUB_REF_NAME" release-dist/* --clobber

      - name: Report private release candidate verification
        if: ${{ github.event.repository.private == true }}
        run: echo "::notice::Release candidate verification completed. Attested releases are published only from the public release repository."
